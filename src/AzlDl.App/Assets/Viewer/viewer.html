<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>azl-dl viewer</title>
<!-- Plays a Spine rig (chibis, dynamic skins) or a Live2D model from the local data folder.
     Query: kind=spine&skel=…&atlas=…, kind=layers&layout=… (a dynamic skin's layers.json) or kind=live2d&model=…,
     plus bg, ink and muted colors (hex, no #).
     The runtimes are not part of azl-dl; the app downloads them into <data>/runtimes on first use. -->
<style>
  :root { --bg: #e2e9ee; --ink: #14263a; --muted: #475a6c; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden;
    font: 14px/1.4 system-ui, "Segoe UI", sans-serif; }
  #stage { position: absolute; inset: 0; }
  #stage canvas { display: block; }
  #bar { position: absolute; left: 16px; bottom: 16px; display: flex; gap: 8px; align-items: center; }
  #bar[hidden] { display: none; }
  #bar label { color: var(--muted); }
  #bar select { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--muted);
    padding: 6px 8px; min-height: 36px; }
  #bar select:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  #message { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px;
    color: var(--muted); }
  #message[hidden] { display: none; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="bar" hidden>
  <label for="animation">Animation</label>
  <select id="animation"></select>
</div>
<div id="message">Loading…</div>
<script>
  const query = new URLSearchParams(location.search);
  for (const [name, key] of [["--bg", "bg"], ["--ink", "ink"], ["--muted", "muted"]]) {
    if (/^[0-9a-fA-F]{6}$/.test(query.get(key) || "")) document.documentElement.style.setProperty(name, "#" + query.get(key));
  }

  const message = document.getElementById("message");
  const fail = (text) => { message.hidden = false; message.textContent = text; };

  function load(src) {
    return new Promise((resolve, reject) => {
      const script = document.createElement("script");
      script.src = src;
      script.onload = resolve;
      script.onerror = () => reject(new Error("Couldn't load " + src));
      document.head.appendChild(script);
    });
  }

  async function showSpine() {
    const css = document.createElement("link");
    css.rel = "stylesheet";
    css.href = "/runtimes/spine-player.css";
    document.head.appendChild(css);
    await load("/runtimes/spine-player.js");

    // The game's rigs list their animations; "normal" or "stand" is the idle pose when there is one.
    const player = window.viewer = new spine.SpinePlayer("stage", {
      skelUrl: query.get("skel"),
      atlasUrl: query.get("atlas"),
      premultipliedAlpha: false,
      showControls: false,
      alpha: true,
      backgroundColor: "#00000000",
      success: (p) => {
        message.hidden = true;
        const play = (name) => p.setAnimation(name, true);
        const idle = picker(p.skeleton.data.animations.map((a) => a.name), "", play);
        if (idle) play(idle);
      },
      error: (_, reason) => fail("The rig couldn't be shown: " + reason),
    });
  }

  // Fills the animation picker; returns the starting animation.
  function picker(names, preferred, play) {
    const select = document.getElementById("animation");
    for (const name of names) select.add(new Option(name, name));
    const idle = names.includes(preferred) ? preferred : names.find((n) => n === "normal" || n === "stand") || names[0];
    select.value = idle;
    select.onchange = () => play(select.value);
    document.getElementById("bar").hidden = names.length < 2;
    return idle;
  }

  // A dynamic skin: one or more skeletons drawn back to front, each placed and scaled as the game's prefab does.
  async function showLayers() {
    await load("/runtimes/spine-player.js");
    const response = await fetch(query.get("layout"));
    if (!response.ok) throw new Error("The layer list couldn't be loaded.");
    const layout = await response.json();

    const canvas = document.createElement("canvas");
    canvas.style.width = canvas.style.height = "100%";
    document.getElementById("stage").appendChild(canvas);
    const context = new spine.webgl.ManagedWebGLRenderingContext(canvas, { alpha: true, premultipliedAlpha: false });
    const renderer = new spine.webgl.SceneRenderer(canvas, context);
    const assets = new spine.webgl.AssetManager(context, "/art/");
    for (const layer of layout) {
      assets.loadBinary(layer.skeleton);
      assets.loadTextureAtlas(layer.atlas);
    }

    await new Promise((resolve, reject) => {
      const wait = () => assets.hasErrors() ? reject(new Error("Couldn't load " + Object.keys(assets.getErrors()).join(", ")))
        : assets.isLoadingComplete() ? resolve() : setTimeout(wait, 30);
      wait();
    });

    const layers = layout.map((layer) => {
      const binary = new spine.SkeletonBinary(new spine.AtlasAttachmentLoader(assets.get(layer.atlas)));
      binary.scale = layer.scale;
      const data = binary.readSkeletonData(assets.get(layer.skeleton));
      const skeleton = new spine.Skeleton(data);
      skeleton.x = layer.x;
      skeleton.y = layer.y;
      return { skeleton, state: new spine.AnimationState(new spine.AnimationStateData(data)) };
    });

    const play = (name) => {
      for (const { skeleton, state } of layers) {
        if (skeleton.data.findAnimation(name)) state.setAnimation(0, name, true);
        else state.clearTracks();
        skeleton.setToSetupPose();
      }
    };
    const names = [...new Set(layers.flatMap((l) => l.skeleton.data.animations.map((a) => a.name)))];
    play(picker(names, layout[0].animation, play));

    // Frame the union of the layers' bounds in the setup pose.
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const { skeleton, state } of layers) {
      state.apply(skeleton);
      skeleton.updateWorldTransform();
      const offset = new spine.Vector2(), size = new spine.Vector2();
      skeleton.getBounds(offset, size, []);
      minX = Math.min(minX, offset.x); minY = Math.min(minY, offset.y);
      maxX = Math.max(maxX, offset.x + size.x); maxY = Math.max(maxY, offset.y + size.y);
    }

    const drawFrame = (delta) => {
      renderer.resize(spine.webgl.ResizeMode.Expand);
      const camera = renderer.camera;
      camera.position.x = (minX + maxX) / 2;
      camera.position.y = (minY + maxY) / 2;
      camera.zoom = Math.max((maxX - minX) / canvas.width, (maxY - minY) / canvas.height) * 1.05;
      context.gl.clearColor(0, 0, 0, 0);
      context.gl.clear(context.gl.COLOR_BUFFER_BIT);
      renderer.begin();
      for (const { skeleton, state } of layers) {
        state.update(delta);
        state.apply(skeleton);
        skeleton.updateWorldTransform();
        renderer.drawSkeleton(skeleton, false);
      }
      renderer.end();
    };

    let last = performance.now();
    const frame = (now) => {
      drawFrame(Math.min((now - last) / 1000, 0.1));
      last = now;
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
    window.viewer = { layers, drawFrame };
    message.hidden = true;
  }

  async function showLive2D() {
    await load("/runtimes/live2dcubismcore.min.js");
    await load("/runtimes/pixi.min.js");
    await load("/runtimes/cubism4.min.js");

    const stage = document.getElementById("stage");
    const app = new PIXI.Application({ backgroundAlpha: 0, resizeTo: window, antialias: true });
    stage.appendChild(app.view);

    const model = window.viewer = await PIXI.live2d.Live2DModel.from(query.get("model"), { autoInteract: false });
    app.stage.addChild(model);
    const fit = () => {
      const scale = Math.min(app.screen.width / model.internalModel.width, app.screen.height / model.internalModel.height) * 0.95;
      model.scale.set(scale);
      model.x = (app.screen.width - model.width) / 2;
      model.y = (app.screen.height - model.height) / 2;
    };
    fit();
    window.addEventListener("resize", fit);
    message.hidden = true;
  }

  const kind = query.get("kind");
  const show = { spine: showSpine, layers: showLayers, live2d: showLive2D }[kind];
  (show ? show() : Promise.reject(new Error("Nothing to show.")))
    .catch((e) => fail(e.message));
</script>
</body>
</html>
